[package]
name = "rust-hmcl"
version = "0.3.14"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A native Rust Minecraft launcher inspired by HMCL"
[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "2"

[dependencies]
anyhow = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
shell-words = "1"
tar = "0.4"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"
