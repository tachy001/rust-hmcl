name: Native launcher
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-desktop:
    name: web-desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            distribution: windows-x64
          - os: ubuntu-22.04
            distribution: linux-x64
          - os: macos-14
            distribution: macos-arm64
          - os: macos-15-intel
            distribution: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev xvfb dbus-x11
      - run: npm ci
      - run: npm run build
      - if: runner.os == 'Windows'
        run: npm run test:console
      - run: cargo test -p rust-hmcl --lib --no-default-features --locked
      - if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle
      - if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app,dmg
      - if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb
      - name: Select the actual packaged executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            echo "HMCL_DESKTOP_BIN=$GITHUB_WORKSPACE/target/release/bundle/macos/Aster Launcher.app/Contents/MacOS/rust-hmcl-desktop" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = Windows ]; then
            echo "HMCL_DESKTOP_BIN=$GITHUB_WORKSPACE/target/release/rust-hmcl-desktop.exe" >> "$GITHUB_ENV"
          else
            mkdir -p "$GITHUB_WORKSPACE/.tools/deb-native"
            dpkg-deb -x target/release/bundle/deb/*.deb "$GITHUB_WORKSPACE/.tools/deb-native"
            echo "HMCL_DESKTOP_BIN=$GITHUB_WORKSPACE/.tools/deb-native/usr/bin/rust-hmcl-desktop" >> "$GITHUB_ENV"
          fi
      - if: runner.os == 'Windows'
        run: node scripts/verify-windows-exe.mjs target/release/rust-hmcl-desktop.exe
      - if: runner.os == 'Windows'
        run: npm run test:native
      - if: runner.os != 'Linux'
        run: npm run test:platform
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/test-platform-ui.mjs
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
      - run: cargo build --bin hmcl-service --no-default-features --locked
      - name: Download and probe the matching Java runtime without starting a game
        run: node scripts/test-java-online.mjs
        env:
          HMCL_SERVICE_BIN: ${{ github.workspace }}/target/debug/hmcl-service${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: npm run package:platform
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-proof-${{ matrix.distribution }}
          path: |
            dist/platform-ui-proof/
            dist/java-online-proof.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: aster-distribution-${{ matrix.distribution }}
          path: dist/distributions/
          if-no-files-found: error
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-webview-proof-windows
          path: dist/native-ui-proof/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: aster-launcher-${{ matrix.os }}
          path: |
            target/release/rust-hmcl-desktop
            target/release/rust-hmcl-desktop.exe
            LICENSE
            assets/hmcl/ATTRIBUTION.md
            assets/aster/ATTRIBUTION.md
            docs/ASTER-README.md
            docs/WEB-MIGRATION.md
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rust-hmcl-${{ matrix.artifact }}
          path: |
            target/release/rust-hmcl
            target/release/rust-hmcl.exe
            LICENSE
            README.md
            vendor/egui/LICENSE-MIT
            vendor/egui/LICENSE-APACHE
            vendor/egui/PATCHES.md

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web-desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aster-distribution-*
          path: release-assets
          merge-multiple: true
      - name: Flatten and select release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-final
          find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.dmg' -o -name '*.tar.gz' \) -print0 |
            while IFS= read -r -d '' file; do cp "$file" release-final/; done
          find release-final -type f -name '*.tar.gz' -delete
          rm -f release-final/SHA256SUMS-*.txt
          for file in release-final/aster-launcher-macos-arm64-*.dmg; do [ -e "$file" ] && mv "$file" release-final/Aster-macOS-arm64.dmg; done
          for file in release-final/aster-launcher-macos-x64-*.dmg; do [ -e "$file" ] && mv "$file" release-final/Aster-macOS-x64.dmg; done
          test "$(find release-final -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum release-final/* > release-final/SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: 星屿 Aster ${{ github.ref_name }} · 三端预览版
          generate_release_notes: true
          prerelease: true
          files: release-final/*
