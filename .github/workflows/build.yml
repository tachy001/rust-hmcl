name: Native launcher
on: [push, pull_request, workflow_dispatch]
jobs:
  web-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test -p rust-hmcl --lib --no-default-features --locked
      - run: npm run tauri build -- --no-bundle
      - if: runner.os == 'Windows'
        run: node scripts/verify-windows-exe.mjs target/release/rust-hmcl-desktop.exe
      - if: runner.os == 'Windows'
        run: npm run test:native
        env:
          HMCL_DESKTOP_BIN: ${{ github.workspace }}/target/release/rust-hmcl-desktop.exe
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-webview-proof-windows
          path: dist/native-ui-proof/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: aster-launcher-${{ matrix.os }}
          path: |
            target/release/rust-hmcl-desktop
            target/release/rust-hmcl-desktop.exe
            LICENSE
            assets/hmcl/ATTRIBUTION.md
            assets/aster/ATTRIBUTION.md
            docs/ASTER-README.md
            docs/WEB-MIGRATION.md
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rust-hmcl-${{ matrix.artifact }}
          path: |
            target/release/rust-hmcl
            target/release/rust-hmcl.exe
            LICENSE
            README.md
            vendor/egui/LICENSE-MIT
            vendor/egui/LICENSE-APACHE
            vendor/egui/PATCHES.md
