name: Cross-platform build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev xvfb dbus-x11
      - name: Check format
        run: cargo fmt --check
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Test Rust core
        run: cargo test --locked
      - name: Build Windows application
        if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app,dmg
      - name: Build Linux application
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb
      - name: Select tested executable on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p .tools/deb-native
          dpkg-deb -x target/release/bundle/deb/*.deb .tools/deb-native
          echo "HMCL_DESKTOP_BIN=$GITHUB_WORKSPACE/.tools/deb-native/usr/bin/rust-hmcl-desktop" >> "$GITHUB_ENV"
      - name: Select tested executable on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: echo "HMCL_DESKTOP_BIN=$GITHUB_WORKSPACE/target/release/bundle/macos/Aster Launcher.app/Contents/MacOS/rust-hmcl-desktop" >> "$GITHUB_ENV"
      - name: Select tested executable on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HMCL_DESKTOP_BIN=$GITHUB_WORKSPACE/target/release/rust-hmcl-desktop.exe" >> "$GITHUB_ENV"
      - name: Verify Windows executable
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-exe.mjs target/release/rust-hmcl-desktop.exe
      - name: Verify native platform startup
        if: runner.os != 'Linux'
        run: node scripts/test-platform-ui.mjs
      - name: Verify native platform startup on Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/test-platform-ui.mjs
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
      - name: Package release files
        run: npm run package:platform
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/distributions/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          expected = f'v{version}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'tag {actual} does not match Cargo.toml version {expected}')
          PY
      - name: Select release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-final
          find release-assets -maxdepth 1 -type f \
            \( -name 'aster-launcher-windows-x64-*.zip' \
            -o -name 'aster-launcher-linux-x64-*.deb' \
            -o -name 'aster-launcher-linux-x64-*.tar.gz' \
            -o -name 'aster-launcher-macos-arm64-*.dmg' \
            -o -name 'aster-launcher-macos-x64-*.dmg' \) \
            -exec cp {} release-final/ \;
          for file in release-final/aster-launcher-macos-arm64-*.dmg; do mv "$file" release-final/Aster-macOS-arm64.dmg; done
          for file in release-final/aster-launcher-macos-x64-*.dmg; do mv "$file" release-final/Aster-macOS-x64.dmg; done
          test "$(find release-final -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum release-final/* > release-final/SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-final/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=true --latest
          else
            gh release create "$RELEASE_TAG" release-final/* --verify-tag --latest --prerelease --generate-notes
          fi
